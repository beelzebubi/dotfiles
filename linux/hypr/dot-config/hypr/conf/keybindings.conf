###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$hyprKey = SUPER ALT CTRL SHIFT

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, space, exec, $menu
#bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# OS commands
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, noctalia msg session lock
bind = $mainMod, comma, exec, noctalia msg settings-toggle                                   # Noctalia settings window
bind = $hyprKey, W, exec, noctalia msg config-reload                                         # was: pkill waybar && waybar

# Noctalia notifications
# $hyprKey already contains SHIFT, so DND uses $mainMod SHIFT instead.
bind = $hyprKey, N, exec, noctalia msg panel-toggle control-center notifications
bind = $mainMod SHIFT, N, exec, noctalia msg notification-dnd-toggle

# Applications
bind = $hyprKey, return, exec, $terminal
bind = $hyprKey, E, exec, $fileManager

# Noctalia panels (replaces rofi, wlogout and grim/slurp)
# The launcher itself is $mainMod + space, via $menu in hyprland.conf.
bind = $hyprKey, Escape, exec, noctalia msg panel-toggle session                             # Session menu
bind = $hyprKey, Print, exec, noctalia msg screenshot-fullscreen pick                        # Screenshot, pick a display
bind = $mainMod SHIFT, S, exec, noctalia msg screenshot-region                               # was: grim -g "$(slurp)" | wl-copy
bind = $hyprKey, C, exec, noctalia msg panel-toggle clipboard                                # Clipboard history
# $hyprKey + space and $hyprKey ALT + space are free now - one launcher is enough.

# Windows
bind = $hyprKey, V, togglefloating,
bind = $hyprKey, P, pseudo, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move workspace to next monitor 
bind = $mainMod SHIFT, period, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, -1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness.
# Going through Noctalia instead of wpctl/brightnessctl gets the OSD as well.
bindel = ,XF86AudioRaiseVolume, exec, noctalia msg volume-up 5%
bindel = ,XF86AudioLowerVolume, exec, noctalia msg volume-down 5%
bindel = ,XF86AudioMute, exec, noctalia msg volume-mute
bindel = ,XF86AudioMicMute, exec, noctalia msg mic-mute
bindel = ,XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindel = ,XF86MonBrightnessDown, exec, noctalia msg brightness-down

# MPRIS, handled by Noctalia - playerctl is no longer needed
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPause, exec, noctalia msg media toggle
bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioPrev, exec, noctalia msg media previous

