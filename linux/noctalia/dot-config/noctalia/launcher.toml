# Launcher - translated from rofi/dot-config/rofi/config.rasi.
#
# rofi modi -> Noctalia providers:
#   drun        -> Applications, the un-prefixed default
#   run         -> show_app_actions below (.desktop actions)
#   window      -> /win
#   filebrowser -> the /f dmenu entry at the bottom of this file
#
# For scripts that called `rofi -dmenu`, the drop-in replacement is
# `noctalia dmenu -p "Pick"` (stdin in, chosen line out, exit 1 on cancel).
#
# What does not carry over: the .rasi theme (the launcher follows the Noctalia
# palette), rofi's own font (Fira Sans 11 - Noctalia has one shell-wide
# font_family, set in config.toml), window-format "{w} · {c} · {t}" (the /win
# provider matches title and app id but has no format string), and the
# mode-switcher row, which the provider prefixes replace.

[shell.launcher]
show_icons       = true      # rofi: show-icons true
compact          = true      # rofi: drun-display-format "{name}" - name only, no subtitle
app_grid         = false     # rofi: listview columns 1, lines 1 - a list, not a grid
categories       = true
show_app_actions = true      # closest thing to rofi's run mode
sort_by_usage    = true
provider_prefix  = "/"

# Built-in prefixes, listed explicitly so the dotfiles document them.
[shell.launcher.providers.calculator]
prefix = "calc"
global = true

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.windows]
prefix = "win"               # rofi -show window

[shell.launcher.providers.panels]
prefix = "pan"

[shell.launcher.providers.session]
prefix = "session"

[shell.launcher.providers.wallpaper]
prefix = "wall"

# ── dmenu providers ──────────────────────────────────────────────────────────

# rofi -show filebrowser
[shell.launcher.dmenu.entry.files]
command = "fd --type f --max-depth 6 . $HOME"
label   = "Files"
prefix  = "f"
glyph   = "folder"
global  = false
exec    = "xdg-open \"{selection}\""

# Switching the palette without opening the settings window.
[shell.launcher.dmenu.entry.theme]
command = "printf 'Rosé Pine\\nCatppuccin\\nGruvbox\\nKanagawa\\nNord\\nTokyo-Night\\nDracula\\nEldritch\\nAyu\\nNoctalia\\n'"
label   = "Theme"
prefix  = "th"
glyph   = "palette"
global  = false
exec    = "noctalia msg color-scheme-set builtin \"{selection}\""
