# This setup ran bare iwd before quickshell. Quickshell.Networking only speaks
# to NetworkManager, so NetworkManager is now in front - but it keeps driving
# the radio through iwd rather than wpa_supplicant, so the existing iwd known
# networks under /var/lib/iwd keep working.
#
# Installed to /etc/NetworkManager/conf.d/ by install.sh.
[device]
wifi.backend=iwd
